<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>콘크리트 사피엔스 프로젝트</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <!-- 구글 검색 결과는 파비콘을 SVG만으로는 잘 못 읽어오는 경우가 있어
       (2026-08-21 확인 — 검색 결과에 사이트 아이콘 대신 기본 지구본 아이콘이
       뜸) PNG를 같이 둔다. SVG를 지원하는 브라우저는 위 태그를 그대로 쓰고,
       그렇지 않은 곳(구글 크롤러 포함)은 이 PNG로 폴백한다. -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
  <!-- 홈 화면에 추가(PWA) — 오프라인/서비스워커까지는 아니고, "브라우저
       탭 대신 홈 화면 아이콘으로" 재방문 문턱을 낮추는 정도가 목적
       (2026-08-21). manifest.json은 Android/데스크톱 크롬이 읽고,
       apple-touch-icon/meta 태그는 iOS 사파리 "홈 화면에 추가"가 읽는다
       (iOS는 manifest.json을 온전히 지원하지 않는다). -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2F3031" />
  <link rel="apple-touch-icon" href="assets/icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="콘크리트 사피엔스" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- 구글 등 검색엔진 결과 스니펫용. 이 태그가 없으면 크롤러가 페이지
       안의 아무 텍스트(예: 카카오맵 API 키 미설정 시 안내 문구)를
       대신 긁어가는 문제가 있었다(2026-08-13 확인, 실제 검색 결과에
       노출). -->
  <meta name="description" content="도시는 건물로 만들어지지만, 장소는 기억으로 만들어집니다. 우리가 살아온 시간과 이야기를 지도 위에 기록하는 공간 아카이브, 콘크리트 사피엔스." />
  <!-- 카카오톡 등 메신저가 링크 공유 시 자동으로 뜯어보는 미리보기 카드용.
       이 사이트는 서버 렌더링이 없는 정적 SPA라 story=ID별로 동적인
       제목/설명을 만들어줄 수 없다 — 메신저의 링크 크롤러는 이 정적
       head 태그만 보고 카드를 만들기 때문에, story 쿼리와 무관하게
       항상 같은 고정 문구가 뜬다(2026-08-13, 카카오톡 공유 대비). -->
  <meta property="og:title" content="콘크리트 사피엔스 지도" />
  <meta property="og:description" content="당신의 기억이 지도에 남아 빛이 됩니다." />
  <meta property="og:site_name" content="콘크리트 사피엔스 지도" />
  <meta property="og:url" content="https://concretesapiens.com" />
  <meta property="og:image" content="https://concretesapiens.com/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <!-- 상단 오버레이 (워드마크/검색/해시태그/배너) — 세로로 자연스럽게
         쌓이는 구조라, 해시태그가 여러 줄로 내려가도 아래 요소들이
         알아서 밀려난다 -->
    <div class="map-overlay-top" id="map-overlay-top">
      <div class="top-bar">
        <div class="wordmark">
          <img class="wordmark-logo" src="assets/wordmark-logo.png" alt="Concrete Sapiens" />
          <small>MEMORY MAP PROJECT</small>
        </div>
        <div class="search-box">
          <div class="search-input-row">
            <input type="text" id="search-input" placeholder="당신의 동네를 검색해보세요" />
            <button id="search-btn">검색</button>
          </div>
          <ul class="search-results hidden" id="search-results"></ul>
        </div>
        <!-- 언제든 다시 볼 수 있는 기능 안내(2026-08-21) — 첫 방문 환영
             모달(welcome-overlay)은 한 번만 뜨고 서비스 컨셉만 짧게
             설명하는데, 기억산책/기억 라디오/시간여행처럼 하단 툴바
             아이콘만으로는 뭔지 감이 안 올 수 있는 기능들을 다시
             찾아볼 자리가 없어서 추가한다. -->
        <button class="help-tour-btn" id="help-tour-btn" aria-label="기능 안내 보기">?</button>

        <!-- 계정 아바타(GNB) — 로그인 상태일 때만 표시. 메뉴는 우상단에
             매달리는 작은 드롭다운 대신 다른 오버레이(composer-card 등)와
             같은 중앙 시트 형태로 통일한다(2026-08-21 디자인 레퍼런스
             반영) — 아이콘 없이 텍스트만 있던 기존 목록에 항목별 아이콘 +
             화살표(›)를 더했다. -->
        <div class="account-menu-wrap hidden" id="account-menu-wrap">
          <button class="account-avatar" id="account-avatar" title="내 계정" aria-label="내 계정">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
          </button>
          <span class="account-notif-dot hidden" id="account-notif-dot" aria-hidden="true"></span>
        </div>
        <div class="overlay hidden" id="account-menu">
          <div class="composer-card account-menu-card">
            <div class="composer-card-inner">
              <div class="account-menu-profile">
                <span class="account-menu-profile-avatar">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
                </span>
                <p class="account-menu-email" id="account-menu-email"></p>
              </div>
              <div class="account-menu-divider"></div>
              <button class="account-menu-item" id="menu-posted">
                <span class="account-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
                <span class="account-menu-label">내가 남긴 기억</span>
                <span class="account-menu-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></span>
              </button>
              <button class="account-menu-item" id="menu-recalled">
                <span class="account-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.2v2.1"/><path d="M7.8 5.3l1 1.9"/><path d="M16.2 5.3l-1 1.9"/><path d="M20.8 6.6a5.5 5.5 0 0 0-7.8 0L12 7.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 23l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
                <span class="account-menu-label">나를 떠올린 기억</span>
                <span class="menu-item-notif-dot hidden" id="menu-recalled-dot" aria-hidden="true"></span>
                <span class="account-menu-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></span>
              </button>
              <button class="account-menu-item" id="menu-overlap">
                <span class="account-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.4-7-11.5A7 7 0 0 1 19 9.5C19 14.6 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg></span>
                <span class="account-menu-label">겹치는 기억</span>
                <span class="menu-item-notif-dot hidden" id="menu-overlap-dot" aria-hidden="true"></span>
                <span class="account-menu-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></span>
              </button>
              <div class="account-menu-overlap-feed hidden" id="account-menu-overlap-feed"></div>
              <button class="account-menu-item" id="menu-reacted">
                <span class="account-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
                <span class="account-menu-label">내가 떠올린 기억</span>
                <span class="account-menu-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></span>
              </button>
              <button class="account-menu-item" id="menu-shared">
                <span class="account-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></span>
                <span class="account-menu-label">전달한 기억</span>
                <span class="account-menu-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></span>
              </button>
              <div class="account-menu-divider"></div>
              <button class="account-menu-item" id="menu-changepw">
                <span class="account-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                <span class="account-menu-label">비밀번호 변경</span>
                <span class="account-menu-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></span>
              </button>
              <button class="account-menu-item account-menu-item--danger" id="menu-logout">
                <span class="account-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                <span class="account-menu-label">로그아웃</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- "기억 아카이브" 진입점 + "오늘의 미션" 칩 — 모바일에서 미니
           플레이어까지 겹쳐 뜨면 지도 보이는 영역이 너무 좁아진다는 피드백
           (2026-08-24)으로 한 줄에 묶는다(모바일 전용, js/filters.js
           renderHashtagChips 참고 — 데스크톱은 기존처럼 해시태그 줄에
           그대로 붙는다). "지금까지 쌓인 기억"/"오늘의 기억" 두 진입점을
           "기억 아카이브" 하나로 합쳤다(2026-08-25, js/app.js
           renderMemoryArchiveEntry/openRecentMemoriesModal 참고 — 정렬
           3종 토글은 그대로 유지). -->
      <div class="today-row" id="today-row">
        <div class="hashtag-bar" id="today-mission-chips"></div>
        <button type="button" class="chip memory-archive-entry hidden" id="memory-archive-entry">기억 아카이브</button>
      </div>
      <!-- 해시태그 칩 (많이 쓰인 순 상위 5개 + 더보기) -->
      <div class="hashtag-bar" id="hashtag-chips"></div>
      <!-- 많이 등록된 곡 칩 — 해시태그와 같은 줄에 이어 붙이면 화면 폭에 따라
           줄바꿈 위치가 들쭉날쭉해서, 항상 별도의 줄로 분리한다(2026-08-19). -->
      <div class="hashtag-bar" id="song-chips"></div>
      <!-- 활성 필터(해시태그/연도) 집단 기억 숫자 배너 — 곡 필터일 때는
           바로 아래 미니 플레이어가 대신 뜨므로 안 보여준다(js/filters.js
           renderFilterBanner, 2026-08-23 — 위 칩의 "곡명 ✕"과 내용이
           겹쳤다는 피드백). -->
      <div class="filter-banner hidden" id="filter-banner"></div>

      <!-- 유튜브 미니 플레이어 — 기억 카드에서 노래를 재생하면 위 칩/배너
           바로 아래 이 자리에 뜬다(2026-08-23, 예전엔 지도 하단에 따로
           떠 있었다). 회상 세션(#app.recall-chrome-hidden) 중에는 이
           위치(map-overlay-top, z-index:20)에 갇혀 있으면 회상 모달
           (.recall-session, z-index:110)에 가려 정지/일시정지가 안
           보이므로, js/recall.js가 세션 진입/종료 시 #app 바로 아래로
           재배치(re-parent)해 mini-player--floating으로 z-index 120에서
           모달 위에 뜨게 한다. -->
      <div class="mini-player hidden" id="mini-player">
        <div class="mini-player-frame-mount" id="mini-player-frame-mount"></div>
        <p class="mini-player-title" id="mini-player-title">노래 재생 중</p>
        <button type="button" class="mini-player-pause" id="mini-player-pause" aria-label="일시정지">⏸</button>
        <button type="button" class="mini-player-stop" id="mini-player-stop" aria-label="재생 중지">✕</button>
      </div>

      <!-- 시간 슬라이더 (누적 보기) -->
      <div class="time-slider-panel hidden" id="time-slider-panel">
        <div class="time-slider-header">
          <span class="time-slider-icon-badge" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          </span>
          <div class="time-slider-header-text">
            <h2 class="time-slider-title" id="time-slider-year-label"></h2>
          </div>
          <button class="time-slider-close" id="time-slider-close" aria-label="닫기">✕</button>
        </div>
        <div class="time-slider-mode-toggle">
          <button class="time-slider-mode-btn time-slider-mode-btn--active" id="time-slider-mode-cumulative">
            <span class="time-slider-mode-icon" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </span>
            ~ 이 해까지
          </button>
          <button class="time-slider-mode-btn" id="time-slider-mode-exact">
            <span class="time-slider-mode-icon" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </span>
            이 해만
          </button>
        </div>
        <div class="time-slider-track-wrap">
          <input type="range" id="time-slider-input" class="time-slider-input" />
          <span class="time-slider-value" id="time-slider-value"></span>
        </div>
        <div class="time-slider-info" id="time-slider-info"></div>
        <button class="time-slider-view-btn" id="time-slider-view-btn">이 기간으로 보기 <span class="time-slider-view-btn-chevron">›</span></button>
      </div>
    </div>

    <!-- 최초 진입 안내 토스트 -->
    <div class="entry-toast" id="entry-toast"></div>
    <!-- 기억 전달하기(공유) 완료 토스트 -->
    <div class="share-toast" id="share-toast"></div>

    <!-- 하단 컨트롤 -->
    <div class="bottom-toolbar">
      <button class="tool-btn tool-btn--radio" id="btn-random">
        <span class="tool-btn-radio-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M8.5 8.5a5 5 0 0 0 0 7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.8 5.8a9 9 0 0 0 0 12.4"/><path d="M18.2 5.8a9 9 0 0 1 0 12.4"/></svg>
        </span>
        기억 라디오
      </button>
      <div class="bottom-toolbar-secondary">
        <button class="tool-btn tool-btn--small" id="btn-my-location">
          <svg class="tool-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
          내 주변
        </button>
        <button class="tool-btn tool-btn--small" id="btn-timeslider">
          <svg class="tool-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          시간여행
        </button>
        <button class="tool-btn tool-btn--small" id="btn-my-memory">
          <svg class="tool-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5S4 15.5 4 9.9A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 8 2.9c0 5.6-8 10.6-8 10.6z"/></svg>
          내 기억
        </button>
      </div>
    </div>

    <!-- Story Bottom Sheet -->
    <div class="sheet-backdrop hidden" id="sheet-backdrop"></div>
    <div class="bottom-sheet hidden" id="bottom-sheet">
      <div class="sheet-handle-row" id="sheet-handle-row">
        <div class="sheet-handle"></div>
        <button class="sheet-close" id="sheet-close" aria-label="닫기">✕</button>
      </div>
      <div class="sheet-scroll" id="sheet-content"></div>
    </div>

    <!-- 기억 남기기 작성 폼 -->
    <div class="overlay hidden" id="composer-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="composer-panel"></div></div>
    </div>

    <!-- 기억 아카이브 (전체 기억 목록, "기억 아카이브" 버튼 클릭 시) -->
    <div class="overlay hidden" id="recent-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="recent-panel"></div></div>
    </div>

    <!-- 시간여행 기간 목록 ("이 기간으로 보기" 버튼 클릭 시) -->
    <div class="overlay hidden" id="slider-period-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="slider-period-panel"></div></div>
    </div>

    <!-- 오늘의 미션 (해시태그 칩 줄의 "오늘의 미션" 칩 클릭 시 — 질문/시간/장소/이번 주 중 요일별로 하나) -->
    <div class="overlay hidden" id="daily-prompt-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="daily-prompt-panel"></div></div>
    </div>

    <!-- 첫 방문 환영 모달 — 브라우저당 한 번만(js/app.js maybeShowWelcomeOverlay,
         2026-08-21). 공유 링크(?story=/?place=)로 들어온 경우는 이미 구체적인
         맥락이 있어 안 띄운다. -->
    <div class="overlay hidden" id="welcome-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="welcome-panel"></div></div>
    </div>

    <!-- 하루 1번, 영화 오프닝 타이틀처럼 화면 전체를 짧게 채우는 장면
         (js/app.js maybeShowTitleCard, 2026-08-25) — 로고/버튼 없이 실제
         기억 한 줄만 보여주고, 탭하거나 잠시 기다리면 그 장소로 카메라가
         이동하며 카드가 열린다. 웰컴 모달을 이미 본 사람에게만 뜬다. -->
    <div class="title-card-overlay hidden" id="title-card-overlay">
      <div class="title-card-content" id="title-card-content"></div>
    </div>

    <!-- 기능 안내 투어(검색창 옆 "?" 버튼, js/helpTour.js, 2026-08-21) —
         단계별(Step 1~5)로 넘겨보는 기능 소개. -->
    <div class="overlay hidden" id="help-tour-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="help-tour-panel"></div></div>
    </div>

    <!-- 회원가입/로그인 (기억 남기기 진입 시 게이트) -->
    <div class="overlay hidden" id="auth-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="auth-panel"></div></div>
    </div>

    <!-- GNB — 내가 남긴/떠올린/전달한 기억 목록 -->
    <div class="overlay hidden" id="mymemory-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="mymemory-panel"></div></div>
    </div>

    <!-- 비밀번호 변경(로그인 상태 전용) — 재설정과 달리 이메일 인증 코드 없이
         현재 비밀번호로 바로 바꾼다. -->
    <div class="overlay hidden" id="changepw-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="changepw-panel"></div></div>
    </div>

    <!-- 검색한 동네 발견 모달 — 검색 결과를 고르면(오늘의 질문 응답 흐름 제외) 뜬다.
         전용 닫기 버튼 대신 오버레이(카드 바깥) 클릭으로 닫는다 — 모바일 폭에서
         버튼이 인용구 텍스트와 겹쳐 안 보이는 문제가 있었다(2026-08-15). -->
    <div class="overlay hidden" id="search-area-overlay">
      <div class="search-area-card">
        <div class="search-area-card-inner" id="search-area-panel"></div>
      </div>
    </div>

    <!-- 이 동네의 다른 기억 목록 (위 모달의 "다른 기억 둘러보기" 클릭 시) -->
    <div class="overlay hidden" id="search-nearby-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="search-nearby-panel"></div></div>
    </div>

    <!-- 기억산책 진입 선택지 — 하단 "내 기억" 버튼 클릭 시 뜬다. 1단계(지도에서
         보기/기억산책), 2단계(내 기억/전체 범위) 모두 같은 패널을 재사용한다. -->
    <div class="overlay hidden" id="recall-choice-overlay">
      <div class="composer-card"><div class="composer-card-inner" id="recall-choice-panel"></div></div>
    </div>

    <!-- 기억산책 / 회상 모드 세션 — 진입하면 검색창/해시태그/툴바 등 평소
         UI를 지우고(#app.recall-chrome-hidden) 이 셸 안에서 별자리 개요 →
         몰입 리빌(점 하나 + 카드)까지 이어진다. -->
    <div class="recall-session hidden" id="recall-session">
      <button type="button" class="recall-exit-btn" id="recall-exit-btn" aria-label="회상 모드 종료">✕</button>

      <div class="recall-constellation hidden" id="recall-constellation">
        <canvas class="recall-constellation-canvas" id="recall-constellation-canvas" width="300" height="300"></canvas>
        <p class="recall-constellation-fact" id="recall-constellation-fact"></p>
        <div class="recall-constellation-actions">
          <button type="button" class="btn-primary" id="recall-walk-start-btn">산책 시작</button>
          <button type="button" class="tool-btn" id="recall-share-btn">나의 기억 지도 저장/공유</button>
        </div>
      </div>

      <div class="recall-card" id="recall-card">
        <p class="recall-card-yearplace" id="recall-card-yearplace"></p>
        <p class="story-content" id="recall-card-content"></p>
        <button type="button" class="btn-primary" id="recall-card-next-btn">다음 기억으로</button>
      </div>
    </div>
  </div>

  <!-- API 키 미설정 시 안내 -->
  <div id="key-warning" class="hidden">
    <div class="box">
      <h1>카카오맵 API 키가 필요해요</h1>
      <p>js/config.js 파일을 열어 KAKAO_APP_KEY 값을 발급받은 JavaScript 키로 교체해주세요.</p>
      <code>
        1. https://developers.kakao.com 접속 후 앱 등록<br />
        2. 플랫폼 &gt; Web에 사이트 도메인 등록<br />
        3. 앱 키 &gt; JavaScript 키 복사<br />
        4. js/config.js의 KAKAO_APP_KEY에 붙여넣기
      </code>
    </div>
  </div>

  <script src="js/config.js"></script>
  <!-- backend.js(ES 모듈)는 aws-amplify를 CDN에서 받아오는데, 이게 카카오 SDK
       로딩보다 늦게 끝날 수도 있다(네트워크 타이밍에 따라 달라짐 — 실제로
       역전되는 걸 확인함). 그래서 순서에 기대지 않고, 여기서 미리 Promise를
       만들어두고 backend.js가 다 되면 그 Promise를 resolve하는 방식으로
       확실하게 동기화한다. -->
  <script>
    window._backendClientReadyResolvers = {};
    window._backendClientReady = new Promise((resolve, reject) => {
      window._backendClientReadyResolvers.resolve = resolve;
      window._backendClientReadyResolvers.reject = reject;
    });
    window._authReadyResolvers = {};
    window._authReady = new Promise((resolve, reject) => {
      window._authReadyResolvers.resolve = resolve;
      window._authReadyResolvers.reject = reject;
    });
  </script>
  <script type="module" src="js/backend.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/map.js"></script>
  <script src="js/composer.js"></script>
  <script src="js/storySheet.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/search.js"></script>
  <script src="js/mymemory.js"></script>
  <script src="js/recall.js"></script>
  <script src="js/scrollFade.js"></script>
  <script src="js/helpTour.js"></script>
  <script>
    if (
      !CONFIG.KAKAO_APP_KEY ||
      CONFIG.KAKAO_APP_KEY === "YOUR_KAKAO_JAVASCRIPT_KEY_HERE"
    ) {
      document.getElementById("key-warning").classList.remove("hidden");
    } else {
      const kakaoScript = document.createElement("script");
      kakaoScript.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_APP_KEY}&autoload=false&libraries=services,clusterer`;
      kakaoScript.onload = () => {
        if (window.startConcreteSapiensApp) {
          window.startConcreteSapiensApp();
        }
      };
      document.head.appendChild(kakaoScript);
    }
  </script>
  <script src="js/app.js"></script>
</body>
</html>
