<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>콘크리트 사피엔스 지도</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div class="map-dim-layer"></div>

    <!-- 상단 오버레이 (워드마크/검색/해시태그/배너) — 세로로 자연스럽게
         쌓이는 구조라, 해시태그가 여러 줄로 내려가도 아래 요소들이
         알아서 밀려난다 -->
    <div class="map-overlay-top" id="map-overlay-top">
      <div class="top-bar">
        <div class="wordmark">
          CONCRETE SAPIENS
          <small>MEMORY MAP</small>
        </div>
        <div class="search-box">
          <div class="search-input-row">
            <input type="text" id="search-input" placeholder="장소 검색" />
            <button id="search-btn">검색</button>
          </div>
          <ul class="search-results hidden" id="search-results"></ul>
        </div>

        <!-- 계정 아바타(GNB) — 로그인 상태일 때만 표시 -->
        <div class="account-menu-wrap hidden" id="account-menu-wrap">
          <button class="account-avatar" id="account-avatar" title="내 계정" aria-label="내 계정"></button>
          <div class="account-menu hidden" id="account-menu">
            <button class="account-menu-item" id="menu-posted">내가 남긴 기억</button>
            <button class="account-menu-item" id="menu-reacted">내가 떠올린 기억</button>
            <button class="account-menu-item" id="menu-shared">전달한 기억</button>
            <div class="account-menu-divider"></div>
            <button class="account-menu-item account-menu-item--danger" id="menu-logout">로그아웃</button>
          </div>
        </div>
      </div>

      <!-- 오늘의 질문 — 매일 하나씩 결정론적으로 노출되는 감성 프롬프트.
           해시태그 칩 사이에 묻히지 않도록 별도 카드로 분리 -->
      <div class="daily-prompt-banner hidden" id="daily-prompt-banner"></div>

      <!-- 해시태그 칩 (많이 쓰인 순 상위 20개 + 더보기, 화면 폭에 맞춰 줄바꿈) -->
      <div class="hashtag-bar" id="hashtag-chips"></div>
      <!-- 전체 등록된 기억 수 ("오늘의 기억" 칩 아래) -->
      <div class="total-count-banner hidden" id="total-count-banner"></div>
      <!-- 활성 필터(해시태그/연도) 집단 기억 숫자 배너 -->
      <div class="filter-banner hidden" id="filter-banner"></div>

      <!-- 시간 슬라이더 (누적 보기) -->
      <div class="time-slider-panel hidden" id="time-slider-panel">
        <div class="time-slider-label">
          <span id="time-slider-year-label"></span>
          <button class="time-slider-close" id="time-slider-close">✕</button>
        </div>
        <input type="range" id="time-slider-input" class="time-slider-input" />
      </div>
    </div>

    <!-- 최초 진입 안내 토스트 -->
    <div class="entry-toast" id="entry-toast"></div>
    <!-- 기억 전달하기(공유) 완료 토스트 -->
    <div class="share-toast" id="share-toast"></div>

    <!-- 하단 컨트롤 -->
    <div class="bottom-toolbar">
      <button class="tool-btn" id="btn-my-location">내 주변</button>
      <button class="tool-btn" id="btn-timeslider">시간여행</button>
      <button class="tool-btn tool-btn--accent" id="btn-random">어딘가의 기억</button>
    </div>
    <button class="fab-add" id="fab-add" title="기억 남기기" aria-label="기억 남기기">＋</button>

    <!-- Story Bottom Sheet -->
    <div class="sheet-backdrop hidden" id="sheet-backdrop"></div>
    <div class="bottom-sheet hidden" id="bottom-sheet">
      <div class="sheet-handle-row" id="sheet-handle-row">
        <div class="sheet-handle"></div>
        <button class="sheet-close" id="sheet-close" aria-label="닫기">✕</button>
      </div>
      <div class="sheet-scroll" id="sheet-content"></div>
    </div>

    <!-- 기억 남기기 작성 폼 -->
    <div class="overlay hidden" id="composer-overlay">
      <div class="composer-card" id="composer-panel"></div>
    </div>

    <!-- 최근 기억 목록 (총 이야기 수 배너 클릭 시) -->
    <div class="overlay hidden" id="recent-overlay">
      <div class="composer-card" id="recent-panel"></div>
    </div>

    <!-- 회원가입/로그인 (기억 남기기 진입 시 게이트) -->
    <div class="overlay hidden" id="auth-overlay">
      <div class="composer-card" id="auth-panel"></div>
    </div>

    <!-- GNB — 내가 남긴/떠올린/전달한 기억 목록 -->
    <div class="overlay hidden" id="mymemory-overlay">
      <div class="composer-card" id="mymemory-panel"></div>
    </div>
  </div>

  <!-- API 키 미설정 시 안내 -->
  <div id="key-warning" class="hidden">
    <div class="box">
      <h1>카카오맵 API 키가 필요해요</h1>
      <p>js/config.js 파일을 열어 KAKAO_APP_KEY 값을 발급받은 JavaScript 키로 교체해주세요.</p>
      <code>
        1. https://developers.kakao.com 접속 후 앱 등록<br />
        2. 플랫폼 &gt; Web에 사이트 도메인 등록<br />
        3. 앱 키 &gt; JavaScript 키 복사<br />
        4. js/config.js의 KAKAO_APP_KEY에 붙여넣기
      </code>
    </div>
  </div>

  <script src="js/config.js"></script>
  <!-- backend.js(ES 모듈)는 aws-amplify를 CDN에서 받아오는데, 이게 카카오 SDK
       로딩보다 늦게 끝날 수도 있다(네트워크 타이밍에 따라 달라짐 — 실제로
       역전되는 걸 확인함). 그래서 순서에 기대지 않고, 여기서 미리 Promise를
       만들어두고 backend.js가 다 되면 그 Promise를 resolve하는 방식으로
       확실하게 동기화한다. -->
  <script>
    window._backendClientReadyResolvers = {};
    window._backendClientReady = new Promise((resolve, reject) => {
      window._backendClientReadyResolvers.resolve = resolve;
      window._backendClientReadyResolvers.reject = reject;
    });
    window._authReadyResolvers = {};
    window._authReady = new Promise((resolve, reject) => {
      window._authReadyResolvers.resolve = resolve;
      window._authReadyResolvers.reject = reject;
    });
  </script>
  <script type="module" src="js/backend.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/map.js"></script>
  <script src="js/composer.js"></script>
  <script src="js/storySheet.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/search.js"></script>
  <script src="js/mymemory.js"></script>
  <script>
    if (
      !CONFIG.KAKAO_APP_KEY ||
      CONFIG.KAKAO_APP_KEY === "YOUR_KAKAO_JAVASCRIPT_KEY_HERE"
    ) {
      document.getElementById("key-warning").classList.remove("hidden");
    } else {
      const kakaoScript = document.createElement("script");
      kakaoScript.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_APP_KEY}&autoload=false&libraries=services,clusterer`;
      kakaoScript.onload = () => {
        if (window.startConcreteSapiensApp) {
          window.startConcreteSapiensApp();
        }
      };
      document.head.appendChild(kakaoScript);
    }
  </script>
  <script src="js/app.js"></script>
</body>
</html>
